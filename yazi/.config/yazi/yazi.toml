[mgr]
sorting = "natural"
sort_dir_first = true
show_hidden = true
linemode = "size_and_mtime"

[opener]
play = [
	{ run = "mpv %s", orphan = true, for = "unix" },
	{ run = '"C:\Program Files\mpv.exe" %s', orphan = true, for = "windows" }
]
edit = [
  { run = "nvim %s", block = true, for = "unix" },
  { run = "%EDITOR% %s", block = true, for = "windows" },
]

[open]
prepend_rules = [
	{ url = "*.toml", use = "edit" },
]
